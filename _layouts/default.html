<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  {% if page.description %}
  <meta name="description" content="{{ page.description }}">
  {% endif %}
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  
  <!-- MathJax Configuration -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true,
        processEnvironments: true
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>
    :root {
      --color-fg-default: #24292f;
      --color-fg-muted: #57606a;
      --color-canvas-default: #ffffff;
      --color-canvas-subtle: #f6f8fa;
      --color-border-default: #d0d7de;
      --color-border-muted: #d8dee4;
      --color-accent-fg: #0969da;
      --color-accent-emphasis: #0969da;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-sans);
      font-size: 17px;
      line-height: 1.7;
      color: var(--color-fg-default);
      background-color: var(--color-canvas-default);
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 3rem 1.5rem 5rem 1.5rem;
    }

    h1, h2, h3, h4, h5, h6 {
      color: var(--color-fg-default);
      font-weight: 600;
      line-height: 1.3;
      margin-top: 2rem;
      margin-bottom: 1rem;
      scroll-margin-top: 2rem;
    }

    h1 {
      font-size: 2.25rem;
      border-bottom: 1px solid var(--color-border-muted);
      padding-bottom: 0.5rem;
      margin-top: 0;
    }

    h2 {
      font-size: 1.6rem;
      border-bottom: 1px solid var(--color-border-muted);
      padding-bottom: 0.4rem;
      margin-top: 2.5rem;
    }

    h3 {
      font-size: 1.25rem;
      margin-top: 2rem;
    }

    p {
      margin-top: 0;
      margin-bottom: 1.25rem;
    }

    a {
      color: var(--color-accent-fg);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 2rem auto;
      border-radius: 6px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    }

    blockquote {
      margin: 1.5rem 0;
      padding: 0.75rem 1.25rem;
      color: var(--color-fg-muted);
      background-color: var(--color-canvas-subtle);
      border-left: 4px solid var(--color-accent-emphasis);
      border-radius: 0 6px 6px 0;
    }

    blockquote > :first-child { margin-top: 0; }
    blockquote > :last-child { margin-bottom: 0; }

    table {
      border-collapse: collapse;
      width: 100%;
      margin: 1.5rem 0;
      display: block;
      overflow-x: auto;
    }

    table th, table td {
      padding: 0.6rem 1rem;
      border: 1px solid var(--color-border-default);
    }

    table th {
      background-color: var(--color-canvas-subtle);
      font-weight: 600;
    }

    table tr:nth-child(2n) {
      background-color: var(--color-canvas-subtle);
    }

    details {
      margin: 1.5rem 0;
      padding: 1rem 1.25rem;
      background-color: var(--color-canvas-subtle);
      border: 1px solid var(--color-border-default);
      border-radius: 8px;
    }

    details summary {
      cursor: pointer;
      font-weight: 600;
      color: var(--color-fg-default);
      outline: none;
      user-select: none;
    }

    details[open] {
      background-color: #fcfdfe;
      border-color: #b6d3f2;
    }

    details[open] summary {
      margin-bottom: 1rem;
      border-bottom: 1px dashed var(--color-border-muted);
      padding-bottom: 0.5rem;
    }

    code, pre {
      font-family: var(--font-mono);
      font-size: 85%;
    }

    code {
      background-color: rgba(175, 184, 193, 0.2);
      padding: 0.2em 0.4em;
      border-radius: 4px;
    }

    pre {
      padding: 1rem;
      background-color: var(--color-canvas-subtle);
      border-radius: 6px;
      overflow-x: auto;
      border: 1px solid var(--color-border-muted);
    }

    pre code {
      background-color: transparent;
      padding: 0;
    }

    hr {
      height: 1px;
      background-color: var(--color-border-muted);
      border: none;
      margin: 2.5rem 0;
    }

    .site-footer {
      margin-top: 4rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--color-border-muted);
      color: var(--color-fg-muted);
      font-size: 0.9rem;
      text-align: center;
    }

    @media (max-width: 768px) {
      body {
        font-size: 16px;
      }
      .container {
        padding: 1.5rem 1rem 3rem 1rem;
      }
      h1 {
        font-size: 1.85rem;
      }
      h2 {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    {{ content }}
    
    <footer class="site-footer">
      <p>Research project on Distinction Observable Theory (DOT / TNR).</p>
      <p><a href="https://doi.org/10.5281/zenodo.20257220">Zenodo DOI: 10.5281/zenodo.20257220</a> &bull; <a href="https://github.com/Nondual-Observer/ObserverInterfece">GitHub Repository</a></p>
    </footer>
  </main>
</body>
</html>
